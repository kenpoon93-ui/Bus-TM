<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豐景園實時交通 (v7 終極穩定版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors">
    
    <div class="h-1 bg-gray-200 dark:bg-gray-800 w-full fixed top-0 z-50">
        <div id="progress-bar" class="h-full bg-blue-500 transition-all duration-1000 w-0"></div>
    </div>

    <div class="max-w-md mx-auto p-4 pt-6 pb-20">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold">豐景園實時交通</h1>
                <p id="status" class="text-sm text-gray-500 dark:text-gray-400 mt-1">載入中...</p>
            </div>
            <button onclick="fetchData()" class="p-3 bg-white dark:bg-gray-800 rounded-full shadow hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-95 transition-transform">
                <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>

        <div class="mb-8">
            <h2 class="text-lg font-semibold mb-3 flex items-center text-red-500">
                <span class="mr-2">🔴</span> 離開屯門 (豐景園站)
            </h2>
            <div id="kmb-outbound" class="space-y-3"></div>
        </div>

        <div class="mb-8">
            <h2 class="text-lg font-semibold mb-3 flex items-center text-green-500">
                <span class="mr-2">🟢</span> 返回屯門 (港島上車)
            </h2>
            <div id="kmb-inbound" class="space-y-3"></div>
        </div>

        <div class="mb-8">
            <h2 class="text-lg font-semibold mb-3 flex items-center text-orange-500">
                <span class="mr-2">🚈</span> 輕鐵 (豐景園站)
            </h2>
            <div id="lrt-data" class="space-y-3"></div>
        </div>
    </div>

    <script>
        const APP_VER = 'v7';
        const TARGET_STOPS = ['豐景園', '利源東街', '永吉街', '文華里'];
        const TARGET_ROUTES = ['60X', '60M', '62X', '62P', '263', '960', '961'];
        let myStopsMap = {}; 
        let countdownInterval;

        // 計算時間，濾除負數時間
        function getMinutes(targetDateStr) {
            const target = new Date(targetDateStr);
            const now = new Date();
            const diff = Math.round((target - now) / 60000);
            if (diff < 0) return '已開出';
            return diff === 0 ? '即將抵達' : diff + ' 分鐘';
        }

        async function getKmbStopsMap() {
            let cached = localStorage.getItem('kmb_stops_' + APP_VER);
            if (cached) {
                let parsed = JSON.parse(cached);
                if (Object.keys(parsed).length > 0) return parsed;
            }

            document.getElementById('status').innerText = '首次運行：正在配對車站...';
            try {
                const res = await fetch("https://data.etabus.gov.hk/v1/transport/kmb/stop");
                const json = await res.json();
                let map = {};
                
                json.data.forEach(s => {
                    TARGET_STOPS.forEach(target => {
                        if (s.name_tc && s.name_tc.includes(target)) {
                            if (!map[target]) map[target] = [];
                            map[target].push(s.stop); // 儲存該站名對應的所有 Stop IDs
                        }
                    });
                });

                if (Object.keys(map).length > 0) {
                    localStorage.setItem('kmb_stops_' + APP_VER, JSON.stringify(map));
                    return map;
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        async function fetchData() {
            clearInterval(countdownInterval);
            document.getElementById('status').innerText = '更新中...';
            
            myStopsMap = await getKmbStopsMap();
            if (!myStopsMap) {
                document.getElementById('status').innerText = '配對巴士站失敗，請檢查網絡後重試。';
                return;
            }

            // 集合所有目標車站嘅 Stop ID
            let allStopIds = [];
            Object.values(myStopsMap).forEach(ids => allStopIds.push(...ids));

            // 改用 Stop-ETA API，穩定獲取該站點所有班次資料
            const kmbPromises = allStopIds.map(stopId => 
                fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`)
                .then(r => r.json())
                .then(data => data.data.map(item => ({...item, req_stop_id: stopId})))
                .catch(e => [])
            );

            const lrtPromise = fetch("https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=260")
                .then(r => r.json())
                .catch(e => null);

            const [kmbResponses, lrtResponse] = await Promise.all([
                Promise.all(kmbPromises),
                lrtPromise
            ]);

            let kmbOut = {}; 
            let kmbIn = {};  

            kmbResponses.flat().forEach(eta => {
                if (!eta || !eta.eta) return;
                
                // 只保留你指定要搭嘅巴士線
                if (!TARGET_ROUTES.includes(eta.route)) return;

                // 搵返呢個 ETA 係屬於邊個車站
                let stopName = '';
                for (const [name, ids] of Object.entries(myStopsMap)) {
                    if (ids.includes(eta.req_stop_id)) stopName = name;
                }
                if (!stopName) return; 

                const dest = eta.dest_tc;
                const timeStr = getMinutes(eta.eta);
                if (timeStr === '已開出') return; // 過期資料唔顯示

                const timeColor = timeStr === '即將抵達' || parseInt(timeStr) <= 3 ? 'text-red-500 font-bold' : 'text-gray-900 dark:text-white';
                const timeHtml = `<span class="${timeColor}">${timeStr}</span>`;

                // 分區邏輯
                if (stopName === '豐景園') {
                    if (!dest.includes('屯門') && !dest.includes('山景') && !dest.includes('建生') && !dest.includes('兆康')) {
                        const key = `${eta.route}_${dest}`;
                        if (!kmbOut[key]) kmbOut[key] = { route: eta.route, dest: dest, times: [] };
                        if (kmbOut[key].times.length < 3) kmbOut[key].times.push(timeHtml);
                    }
                } else if (['利源東街', '永吉街', '文華里'].includes(stopName)) {
                    if (dest.includes('屯門') || dest.includes('山景') || dest.includes('建生')) {
                        const key = `${eta.route}_${stopName}`;
                        if (!kmbIn[key]) kmbIn[key] = { route: eta.route, stop: stopName, dest: dest, times: [] };
                        if (kmbIn[key].times.length < 3) kmbIn[key].times.push(timeHtml);
                    }
                }
            });

            // 渲染畫面
            const renderKmbCard = (title, subtitle, times) => `
                <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <div class="flex justify-between items-end">
                        <div>
                            <div class="text-xl font-bold text-blue-600 dark:text-blue-400">${title}</div>
                            <div class="text-xs text-gray-500 mt-1">${subtitle}</div>
                        </div>
                        <div class="text-right space-y-1 text-sm flex flex-col justify-end">
                            ${times.join('<br>')}
                        </div>
                    </div>
                </div>`;

            let outHtml = '';
            Object.values(kmbOut).sort((a,b) => a.route.localeCompare(b.route)).forEach(item => {
                outHtml += renderKmbCard(item.route, `往 ${item.dest}`, item.times);
            });
            document.getElementById('kmb-outbound').innerHTML = outHtml || '<p class="text-sm text-gray-500 p-2">暫時沒有班次資料</p>';

            let inHtml = '';
            Object.values(kmbIn).sort((a,b) => (a.route + a.stop).localeCompare(b.route + b.stop)).forEach(item => {
                inHtml += renderKmbCard(item.route, `於 ${item.stop} 上車 (往 ${item.dest})`, item.times);
            });
            document.getElementById('kmb-inbound').innerHTML = inHtml || '<p class="text-sm text-gray-500 p-2">暫時沒有班次資料</p>';

            // 處理輕鐵資料
            let lrtHtml = '';
            if (!lrtResponse || lrtResponse.status !== 1) {
                lrtHtml = '<div class="text-sm text-red-500 bg-red-50 dark:bg-red-900/20 p-3 rounded-lg">無法載入輕鐵資料，請稍後再試。</div>';
            } else {
                lrtResponse.platform_list.forEach(plat => {
                    let platHtml = `<div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 mb-3">
                        <div class="text-sm font-bold text-gray-700 dark:text-gray-300 mb-2 border-b border-gray-200 dark:border-gray-700 pb-1">月台 ${plat.platform_id}</div>`;
                    
                    if (plat.route_list.length === 0) {
                         platHtml += `<div class="text-sm text-gray-500">暫無列車</div>`;
                    } else {
                        plat.route_list.forEach(train => {
                            const tStr = train.time_ch.includes('-') ? '即將抵達' : train.time_ch;
                            const tColor = tStr === '即將抵達' || tStr === '1 分鐘' ? 'text-red-500 font-bold' : 'text-gray-900 dark:text-white';
                            platHtml += `<div class="flex justify-between items-center mb-1 text-sm">
                                <div><span class="font-bold text-orange-500 mr-2">${train.route_no}</span>往 ${train.dest_ch}</div>
                                <div class="${tColor}">${tStr}</div>
                            </div>`;
                        });
                    }
                    platHtml += `</div>`;
                    lrtHtml += platHtml;
                });
            }
            document.getElementById('lrt-data').innerHTML = lrtHtml || '<p class="text-sm text-gray-500">暫時沒有輕鐵資料</p>';

            document.getElementById('status').innerText = `最後更新: ${new Date().toLocaleTimeString('zh-HK', {hour12: false})}`;
            startProgress();
        }

        function startProgress() {
            const bar = document.getElementById('progress-bar');
            bar.style.transition = 'none';
            bar.style.width = '0%';
            
            let progress = 0;
            countdownInterval = setInterval(() => {
                progress += (100 / 300); 
                bar.style.transition = 'width 0.1s linear';
                bar.style.width = `${progress}%`;
                
                if (progress >= 100) {
                    clearInterval(countdownInterval);
                    fetchData(); 
                }
            }, 100);
        }

        fetchData();
    </script>
</body>
</html>
